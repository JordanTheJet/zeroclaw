[package]
name = "zeroclaw-embedding-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-supervised native embedding-provider plugin bridge for ZeroClaw."
publish = false
build = "build.rs"

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-config = { workspace = true, default-features = false }
zeroclaw-memory.workspace = true
zeroclaw-plugins.workspace = true
anyhow = "1.0"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider", "__rustls-ring"] }
ring = "0.17"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync"] }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = []
reference-sidecar = ["dep:axum", "dep:sha2", "tokio/io-std", "tokio/macros", "tokio/net", "tokio/rt-multi-thread"]

[[bin]]
name = "zeroclaw-reference-embedding-sidecar"
path = "src/bin/reference_embedding_sidecar.rs"
required-features = ["reference-sidecar"]

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
toml = "1.0"

[build-dependencies]
toml = "1.0"
