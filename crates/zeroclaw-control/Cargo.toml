[package]
name = "zeroclaw-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-independent management core for ZeroClaw; currently capability-free guided agent creation (seed of ControlService)"
publish = false

[features]
# Test-only. Compiles the fixture-credential constructors that let a test drive
# the grant-gated tools before phase 3 registration exists. Deliberately absent
# from `default` and from every released profile: the workspace enables it only
# through `[dev-dependencies]`, so `cargo build --release` links none of it.
fixture-grants = []

[dependencies]
anyhow = "1.0"
# Advisory file locking for the control-plane transaction lock the durable
# apply worker holds while it claims and applies one approved proposal. `fs2
# = "0.4"` is already declared verbatim by zeroclaw-config — which this crate's
# dependency graph already pulls in — so the resolved version (0.4.3) is
# unchanged and Cargo.lock does not move. It is the same primitive the
# revision-bound config write lock (finding #41) uses.
fs2 = "0.4"
hex = "0.4"
# RFC 5869 HKDF-SHA256 for the ADR-015 approval and audit key is implemented in
# `keys.rs` over `hmac` + `sha2`. Both already build in this workspace (channels,
# gateway, providers), so no new crate enters the dependency graph and there is
# no `hkdf` crate to add.
hmac = "0.12"
# `rand::rngs::SysRng` is the operating system's random source (a re-export of
# `getrandom`), used for client credentials and instance identifiers. `rand
# = "0.10"` is already declared verbatim by zeroclaw-config, zeroclaw-runtime,
# and zeroclaw-providers — all three already in this crate's dependency graph —
# so the resolved version is unchanged and Cargo.lock does not move.
rand = "0.10"
# Already an unconditional dependency of the `zeroclaw` binary, so the control
# protocol's request and response schemas are generated from the compiled types
# rather than hand written without adding anything to a shipped build.
schemars = "1.2"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["fs"] }
toml = "1.0"
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true
zeroclaw-providers.workspace = true
zeroclaw-runtime.workspace = true

[dev-dependencies]
anyhow = "1.0"
async-trait = "0.1"
tempfile = "3.26"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync"] }
