name: Desktop Sign Test (dry run)

# Isolated dry run of the release pipeline's `build-desktop` job: builds the
# bundled-kernel Tauri app and signs + notarizes it using the same APPLE_*
# secrets the real release uses. arm64-only for speed (upstream does universal).
on:
  push:
    branches: [desktop-sign-test]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build + Sign + Notarize Desktop (arm64)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: macos-tauri-dryrun

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Sync Tauri version with Cargo.toml
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          cd apps/tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          echo "Tauri version set to: $VERSION"

      - name: Stage bundled kernel sidecar (arm64)
        run: scripts/desktop/prepare-kernel.sh --target aarch64-apple-darwin

      - name: Enable macOS signing + notarization (fail loudly if a secret is missing)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "::error::APPLE_CERTIFICATE missing"; exit 1; fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then echo "::error::APPLE_CERTIFICATE_PASSWORD missing"; exit 1; fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then echo "::error::APPLE_SIGNING_IDENTITY missing"; exit 1; fi
          if [ -z "$APPLE_ID" ]; then echo "::error::APPLE_ID missing"; exit 1; fi
          if [ -z "$APPLE_PASSWORD" ]; then echo "::error::APPLE_PASSWORD missing"; exit 1; fi
          if [ -z "$APPLE_TEAM_ID" ]; then echo "::error::APPLE_TEAM_ID missing"; exit 1; fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "All 6 APPLE_* secrets present — signing + notarization enabled."

      - name: Build Tauri app (arm64, bundled kernel, signed + notarized)
        working-directory: apps/tauri
        run: cargo tauri build --target aarch64-apple-darwin --config tauri.bundled.conf.json

      - name: Verify the result (codesign + notarization staple + Gatekeeper)
        shell: bash
        run: |
          set -x
          DMG=$(find target -name '*.dmg' | head -1)
          echo "dmg: $DMG"
          codesign -dvv "$DMG" 2>&1 | grep -iE "Authority|TeamIdentifier" || true
          echo "--- stapler validate (proves notarization ticket stapled) ---"
          xcrun stapler validate "$DMG" || { echo "::error::dmg not stapled — notarization failed"; exit 1; }
          echo "--- Gatekeeper assessment ---"
          spctl -a -vvv -t install "$DMG" 2>&1 | head -3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-arm64-dryrun-dmg
          path: '**/*.dmg'
          retention-days: 7
