name: Pub crates.io

# Publishes the workspace to crates.io. Split into two jobs on purpose:
#
#   preflight — packages and compiles every crate from its own tarball, with no
#               environment gate and no token. Nothing here can mutate crates.io.
#   publish   — the irreversible upload, behind the `crates-io` environment gate.
#
# The gate sits *after* preflight so the approver sees a green dry run before
# approving. crates.io versions can be yanked but never replaced or deleted, so
# an approval here is the last reversible moment.

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Run preflight only (no upload)"
        required: false
        default: false
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Run preflight only (no upload)"
        required: false
        default: true
        type: boolean

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (package + verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate tag and resolve version
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must be vX.Y.Z format. Got: ${RELEASE_TAG}"
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"

          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match workspace version ${cargo_version}."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The root crate's `include` ships `/web/dist/**/*`, but those files are
      # gitignored build output — a checkout alone leaves only logo.png, which
      # would publish a `zeroclaw` whose gateway serves no dashboard. Build it
      # here exactly as the release workflow's `web` job does.
      - name: Build web dashboard
        run: cargo web build

      - name: Preflight
        shell: bash
        run: ./scripts/release/publish-crates.sh "${{ steps.meta.outputs.version }}"

      - name: Summarize
        if: always()
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### crates.io preflight"
            echo "- tag: \`${TAG}\`"
            echo "- version: \`${VERSION}\`"
            echo "- dry_run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    needs: [preflight]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The first release creates 16 new crates, and crates.io throttles new-crate
    # creation to roughly one per 10 minutes. A short timeout would kill the run
    # mid-sequence; the script resumes on re-run, but finishing in one go is better.
    environment:
      name: crates-io
      url: https://crates.io/crates/zeroclaw
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        run: cargo web build

      - name: Publish
        id: publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is required to publish."
            echo "::error::Mint one at https://crates.io/settings/tokens. A crate that does not"
            echo "::error::yet exist needs the publish-new scope, not just publish-update."
            exit 1
          fi
          ./scripts/release/publish-crates.sh --execute "$VERSION"

      # Must branch on the publish outcome: `if: always()` with an unconditional
      # success banner is worst on the run that actually needs reading — a
      # partial, irreversible publish would be reported as complete.
      - name: Summarize
        if: always()
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [[ "$OUTCOME" == "success" ]]; then
            {
              echo "### Published to crates.io"
              echo "- version: \`${VERSION}\`"
              echo "- verify: \`cargo install zeroclaw --version ${VERSION} --locked\`"
              echo "- https://crates.io/crates/zeroclaw/${VERSION}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### crates.io publish did NOT complete (outcome: \`${OUTCOME}\`)"
              echo "Some crates may already be uploaded — uploads cannot be undone."
              echo "Check the Publish step log for the last crate it reported, then"
              echo "re-run this workflow for the same tag; it skips what already landed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
