name: Desktop Bundle Dry Run

# Builds the self-contained desktop installer on macOS, Linux, and Windows
# the way Release Stable does: the real web dashboard, a kernel sidecar staged
# with `--features embedded-web`, the empty-directory dashboard smoke test,
# then `cargo tauri build` with the sidecar overlay. Nothing is signed or
# published. Release Stable runs these steps only for a stable tag, so this
# is the pre-tag evidence for desktop packaging changes.
#
# Differences from the release jobs: macOS builds the runner's arm64 host
# target instead of the universal binary, and the Tauri version is not synced
# from Cargo.toml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/desktop/**"
      - "apps/tauri/tauri*.json"
      - "apps/tauri/build.rs"
      - "apps/tauri/Info.plist"
      - "apps/tauri/windows/**"
      - ".github/workflows/desktop-bundle-check.yml"
      - ".github/workflows/release-stable-manual.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Build Web Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Same wrapper the release web job uses: it generates the API types the
      # dashboard's type check needs, then runs `npm ci` and the Vite build.
      - name: Build web dashboard
        run: cargo web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  bundle:
    name: Desktop bundle (${{ matrix.os }})
    needs: [web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            kernel: zeroclaw-aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            kernel: zeroclaw-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            kernel: zeroclaw-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Tauri v2 needs WebKitGTK + libsoup + GTK on Linux.
      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: desktop-bundle
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The real dashboard build, not a placeholder: the kernel embeds it and
      # the smoke test below requires it at the dashboard root.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/

      - name: Install Tauri CLI
        shell: bash
        run: bash scripts/ci/install_release_tool.sh tauri-cli

      - name: Stage bundled kernel sidecar
        shell: bash
        run: scripts/desktop/prepare-kernel.sh --target ${{ matrix.target }} --features embedded-web

      # Guards the embedded desktop dashboard; see the bespoke gate registry in README.md.
      - name: Smoke test embedded dashboard from an empty directory
        shell: bash
        run: scripts/desktop/smoke-dashboard.sh "apps/tauri/binaries/${{ matrix.kernel }}"

      - name: Build Tauri app (bundled kernel, unsigned)
        working-directory: apps/tauri
        run: cargo tauri build --config tauri.bundled.conf.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3
