name: PR Queue Hygiene

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review]
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to check (leave empty to run the idle-draft sweep)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-queue-hygiene-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  hygiene:
    name: Apply PR queue hygiene
    # Queue hygiene provenance and retirement: pr-workflow.md#queue-hygiene-automation.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRUSTED_REF: ${{ github.event_name == 'pull_request_target' && github.sha || github.event.repository.default_branch }}
      ENFORCE: ${{ vars.PR_QUEUE_HYGIENE_ENFORCE == 'true' && 'true' || 'false' }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Fetch trusted hygiene script
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/contents/scripts/github/pr_queue_hygiene.py?ref=$TRUSTED_REF" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/pr_queue_hygiene.py"
          test -s "$RUNNER_TEMP/pr_queue_hygiene.py"

      - name: Check pull request
        if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        run: |
          python3 "$RUNNER_TEMP/pr_queue_hygiene.py" --repository "$REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY" pr --pr-number "$PR_NUMBER"

      - name: Handle failed Quality Gate
        if: github.event_name == 'workflow_run'
        run: |
          python3 "$RUNNER_TEMP/pr_queue_hygiene.py" --repository "$REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY" ci --head-sha "$HEAD_SHA"

      - name: Remind idle drafts
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
        run: |
          python3 "$RUNNER_TEMP/pr_queue_hygiene.py" --repository "$REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY" idle-drafts
